<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI,Arial,sans-serif">
<rect width="720" height="330" rx="14" fill="#14181f"/>
<text x="24" y="38" fill="#e8ecf2" font-size="20" font-weight="700">What each feature brings · Ce que rapporte chaque réglage</text>
<text x="24" y="60" fill="#9aa4b2" font-size="13">FPS gain, console simulated (benchmark noise ≈ ±5 %)</text>
<line x1="300" y1="72" x2="300" y2="315" stroke="#2a3140"/>
<g font-size="14" fill="#e8ecf2">
<text x="24" y="98">View distance cap (worst spots)</text><rect x="300" y="84" width="350" height="20" rx="4" fill="#4caf7a"/><text x="658" y="99">+50 %</text>
<text x="24" y="132">Radius 800 m in the air</text><rect x="300" y="118" width="98" height="20" rx="4" fill="#4caf7a"/><text x="406" y="133">+14 %</text>
<text x="24" y="166">View distance cap (average)</text><rect x="300" y="152" width="91" height="20" rx="4" fill="#4caf7a"/><text x="399" y="167">+13 %</text>
<text x="24" y="200">Distant shadows min (on foot)</text><rect x="300" y="186" width="60" height="20" rx="4" fill="#4caf7a"/><text x="368" y="201">+8,6 %</text>
<text x="24" y="234">Radius 800 m on the ground</text><rect x="300" y="220" width="35" height="20" rx="4" fill="#8a94a6"/><text x="343" y="235">+5 % → kept full</text>
<text x="24" y="268">Grass, lights, small props, textures 1024</text><rect x="300" y="254" width="21" height="20" rx="4" fill="#8a94a6"/><text x="329" y="269">0 – 5 % → dropped</text>
<text x="24" y="302">Streaming: hitches &gt; 100 ms</text><text x="300" y="302" fill="#7fd1a4">38 / 97 → 0 / 97</text>
</g>
</svg>

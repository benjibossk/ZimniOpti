<text x="200" y="186" fill="#ffd166" font-size="12">camera</text>
<g font-size="14" fill="#e8ecf2">
<text x="370" y="86">• Map split into 1 km tiles (236 tiles,</text>
<text x="382" y="106">~2.6 M trees, bushes, small props)</text>
<text x="370" y="140" fill="#7fd1a4">• Console: tiles created only inside the radius</text>
<text x="382" y="160" fill="#9aa4b2">1 300 m (Series S/PS4) · 1 700 m (X/PS5)</text>
<text x="370" y="194">• Never-created object = 0 memory</text>
<text x="382" y="214" fill="#9aa4b2">(deleting later does NOT give memory back)</text>
<text x="370" y="248">• PC &amp; server: whole map created</text>
<text x="382" y="268" fill="#9aa4b2">AI, bullets, collisions unchanged</text>
<text x="370" y="302">• Walls/fences stay in the map (destructible)</text>
</g>
